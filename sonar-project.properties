# SonarCloud Configuration for lahiri-api
sonar.organization=thanakrit-promsiri
sonar.projectKey=thanakrit-promsiri_lahiri-api
sonar.projectName=lahiri-api

# Source & Test Directories
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/logs/**,**/*.log,**/*.json,**/*.html,bin/**,response/**
sonar.coverage.exclusions=main.go,logger.go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Go Test Coverage Report Path
sonar.go.coverage.reportPaths=coverage.out
